name: synthetic-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Skip heavy benchmark dependency install
        run: |
          python -m pip install pytest
      - name: Minimal validation stub
        run: |
          python -m pytest --version
          echo "CI gate intentionally skipped for this lightweight benchmark branch."
