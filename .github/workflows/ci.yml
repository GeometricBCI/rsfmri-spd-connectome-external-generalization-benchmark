name: synthetic-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Compile imports
        run: python -m compileall -q spd_connectome_benchmark *.py
      - name: Run synthetic tests
        run: python -m pytest
      - name: Check installed environment and unified CLI
        run: |
          python -m pip check
          rsfmri-spd-benchmark --help
      - name: Build and smoke-test a non-editable wheel
        run: |
          wheelhouse="${RUNNER_TEMP}/wheelhouse"
          wheelvenv="${RUNNER_TEMP}/wheel-venv"
          external_project="${RUNNER_TEMP}/external-project"
          mkdir -p "${wheelhouse}" "${external_project}"
          python -m pip wheel --no-deps --wheel-dir "${wheelhouse}" .
          python -m venv "${wheelvenv}"
          "${wheelvenv}/bin/python" -m pip install --no-deps "${wheelhouse}"/*.whl
          cd "${external_project}"
          "${wheelvenv}/bin/rsfmri-spd-benchmark" --help
          "${wheelvenv}/bin/python" -c 'from pathlib import Path; from spd_connectome_benchmark.configuration import resolve_config; c = resolve_config([], environ={}, cwd=Path.cwd()); assert c.input_root == Path.cwd().parent / "rsfmri_spd_data"; assert c.output_root == Path.cwd() / "results" / "benchmark_csv"'
      - name: Exercise safe dry run with filename-only placeholders
        run: |
          dry_root="${RUNNER_TEMP}/synthetic-input"
          mkdir -p "${dry_root}/atlas_schaefer_100"
          for dataset in cobre adnidod camcan abide oasis3 adni; do
            touch "${dry_root}/atlas_schaefer_100/${dataset}_X_y.pkl"
          done
          rsfmri-spd-benchmark --dry-run --input-root "${dry_root}"
