  camcan:
    display_name: Cam-CAN
    aliases:
      - CamCAN
      - Cam-CAN
    participant_level_release: allowed
    participant_level_connectomes:
      status: allowed
      license:
        type: CC-BY-4.0
      confirmation:
        available: true
      allowed_metadata:
        - age
        - sex
      prohibited:
        - raw_images
        - raw_T1_images
        - T1w_images
        - identifiable_images
        - home_interview_variables
        - identifiable_behavioural_variables
        - CCID
      required_conditions:
        - attribution
        - exclude_identifiable_material
        - limit_metadata_to_age_and_sex
      required_citation:
        - Shafto_et_al_CamCAN_cohort_paper
    final_approval_status: permission_confirmed_artifact_binding_required
    approval_reference: approvals.datasets.camcan
