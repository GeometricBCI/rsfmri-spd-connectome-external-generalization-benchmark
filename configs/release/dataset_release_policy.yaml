schema_version: 1

default:
  participant_level_release: forbidden
  final_approval_status: not_approved
  unknown_fields: deny
  unknown_content_categories: deny
  decisions:
    participant_level_connectomes: forbidden
    participant_level_metadata: forbidden
    exact_split_membership: forbidden
    aggregate_metrics: allowed_if_explicitly_allowlisted_and_reviewed
    statistical_summaries: allowed_if_explicitly_allowlisted_and_reviewed
    figure_source_data: allowed_if_explicitly_allowlisted_and_reviewed
    configuration_files: allowed_if_explicitly_allowlisted_and_reviewed
    processing_scripts: allowed_if_explicitly_allowlisted_and_reviewed
    reconstruction_instructions: allowed_if_explicitly_allowlisted_and_reviewed

unknown_dataset:
