    participant_level_connectomes:
      status: allowed
      license:
        type: ABIDE_source_license
      confirmation:
        available: true
      allowed_metadata: []
      prohibited:
        - raw_images
        - T1w_images
        - original_source_paths
        - original_identifiers
        - unrestricted_clinical_text
        - arbitrary_behavioural_variables
        - questionnaire_responses
      required_conditions:
        - attribution
        - non_commercial_use
        - share_alike_if_required
      required_citation:
        - ABIDE_reference
        - INDI_reference
    final_approval_status: permission_confirmed_artifact_binding_required
    approval_reference: approvals.datasets.abide
