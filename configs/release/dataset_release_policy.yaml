  final_approval_status: not_approved
  decisions:
    participant_level_connectomes: forbidden
    participant_level_metadata: forbidden
    exact_split_membership: forbidden
    aggregate_metrics: forbidden
    statistical_summaries: forbidden
    figure_source_data: forbidden
    configuration_files: forbidden
    processing_scripts: forbidden
    reconstruction_instructions: forbidden
  reason: Unknown datasets are non-public by default.

