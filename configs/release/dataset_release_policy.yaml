      configuration_files: allowed_if_explicitly_allowlisted_and_reviewed
      processing_scripts: allowed_if_explicitly_allowlisted_and_reviewed
      reconstruction_instructions: allowed_if_explicitly_allowlisted_and_reviewed
    restricted_reconstruction_required_until_approved: true

  1000brains:
    display_name: 1000BRAINS
    aliases:
      - 1000BRAINS
    participant_level_release: forbidden_unless_explicitly_approved
    final_approval_status: not_approved
    approval_reference: approvals.datasets.1000brains
    explicit_policy_change_required: true
    decisions:
      participant_level_connectomes: forbidden_unless_explicitly_approved_and_allowlisted
      participant_level_metadata: forbidden_unless_explicitly_approved_and_allowlisted
      exact_split_membership: forbidden_unless_explicitly_approved_and_allowlisted
      aggregate_metrics: requires_manual_approval_and_allowlist
      statistical_summaries: requires_manual_approval_and_allowlist
      figure_source_data: requires_manual_approval_and_allowlist
      configuration_files: requires_manual_approval_and_allowlist
      processing_scripts: allowed_if_explicitly_allowlisted_and_reviewed
      reconstruction_instructions: requires_manual_approval_and_allowlist

approval_semantics:
  approval_file: configs/release/manual_approvals.yaml
  recognized_status: approved
  required_fields:
    - approved_by
    - approved_on
    - scope
    - evidence
  empty_or_missing_fields_invalidate_approval: true
  approval_never_overrides_forbidden_policy: true
  policy_change_and_approval_both_required_for_forbidden_unless_explicitly_approved: true
