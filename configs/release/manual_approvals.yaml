manual_action_items:
  - Confirm the complete creator list and creator order from an authoritative manuscript record.
  - Confirm affiliations and add ORCIDs only when authoritatively documented.
  - Confirm funding or explicitly record that there is none.
  - Confirm the manuscript DOI and related identifiers, or explicitly record their absence.
  - Confirm source-code and documentation license scopes.
  - Confirm how Zenodo should display the mixed dataset-specific rights without
    replacing CamCAN, ABIDE, or COBRE terms with one global data license.
  - Record the exact ABIDE and COBRE license title/version and complete required
    citation text from the authoritative confirmations.
  - Bind the confirmed CamCAN, ABIDE, and COBRE permissions to an authorized
    reviewer, ISO review date, non-sensitive evidence reference, and each exact
    safe-export source binding.
  - Review every aggregate result and all PDF metadata before safe export.
  - Review the final privacy, manifest, checksum, archive-revalidation, and Zenodo-form reports.
