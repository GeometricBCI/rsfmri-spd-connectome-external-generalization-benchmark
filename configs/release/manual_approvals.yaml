approval_protocol:
  default_status: manual_required
  recognized_approved_status: approved
  designated_reviewer: Ce Ju
  designation_confirmed_on: "2026-07-27"
  required_fields_for_approval:
    - approved_by
    - approved_on
    - scope
    - evidence
  null_or_empty_required_field_invalidates_approval: true
  approval_does_not_override_forbidden_policy: true
  deliberate_confirmation_required: true
  required_confirmation_text: >-
    I reviewed the stated scope, governing terms, privacy risk, and evidence,
    and authorize only the explicitly described public-release materials.

