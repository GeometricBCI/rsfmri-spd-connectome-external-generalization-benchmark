schema_version: 1

default:
  decision: deny
  unknown_columns: deny
  unknown_array_keys: deny
  case_sensitive_column_matching: false

identifier_policy:
  original_identifiers: forbidden
  hashed_original_identifiers: forbidden
  release_safe_sample_uid:
    decision: requires_dataset_approval_and_explicit_allowlist
    must_not_encode_source_identifier: true
    must_be_unique: true
    permitted_locations:
      - public_metadata
      - exact_split_membership

forbidden_columns:
  - ccid
  - participant_id
  - subject_id
  - subjectid
  - scan_id
  - session_id
  - session
  - visit_id
  - image_id
  - original_filename
  - filename
  - file_path
  - filepath
  - source_path
  - acquisition_date
  - birth_date
  - date_of_birth
  - clinical_notes
  - clinical_text
  - unrestricted_clinical_text
  - free_text
  - open_text
  - comments
  - home_interview
  - home_interview_variables
  - questionnaire
  - questionnaire_response
  - questionnaire_responses
  - survey_item
  - survey_response
  - behavioral_measure
  - behavioral_variables
  - behavioural_measure
  - behavioural_variables
  - input_path
  - local_path
  - raw_filename
  - source_filename
  - institution_identifier

forbidden_column_patterns:
  - "(^|_)participant(_|$)"
  - "(^|_)subject(_|$)"
  - "(^|_)scan(_|$)"
  - "(^|_)session(_|$)"
  - "(^|_)visit(_|$)"
  - "(^|_)image(_|$)"
  - "(^|_)(file|source)_?path(_|$)"
  - "(^|_)(acquisition|birth)_?date(_|$)"
  - "(^|_)(notes|free_?text)(_|$)"
  - "(^|_)(comments?|open_?text|clinical_?text)(_|$)"
  - "(^|_)home_?interview(_|$)"
  - "(^|_)(questionnaire|survey)(_|$)"
  - "(^|_)(behaviou?r|behaviou?ral)(_|$)"
  - "(^|_)(input|local|raw|source)_?(file_?name|path)(_|$)"

tables:
  public_metadata:
    default_allowed_columns: []
    candidate_columns_requiring_dataset_specific_manual_approval:
      - sample_uid
      - age
      - diagnosis
      - sex
      - site
      - scanner
      - target
    reject_unrecognized_columns: true

  exact_split_membership:
    allowed_columns:
      - fold
      - partition
      - sample_uid
    allowed_partitions:
      - train
      - validation
      - test
    requires_dataset_approval: true
    reject_original_or_hashed_identifiers: true

  aggregate_metrics:
    allowed_columns:
      - dataset
      - atlas
      - task
      - target
      - model
      - cv
      - fold
      - harmonization
      - metric
      - value
      - mean
      - standard_deviation
      - standard_error
      - confidence_interval_lower
      - confidence_interval_upper
      - n_folds
      - n_samples
      - elapsed_seconds
    reject_unrecognized_columns: true

  statistical_summaries:
    allowed_columns:
      - dataset
      - comparison
      - test_name
      - statistic
      - degrees_of_freedom
      - p_value
      - adjusted_p_value
      - correction
      - effect_size
      - confidence_interval_lower
      - confidence_interval_upper
      - n_observations
    reject_unrecognized_columns: true

  figure_source_data:
    allowed_columns:
      - dataset
      - atlas
      - task
      - target
      - model
      - cv
      - fold
      - harmonization
      - metric
      - value
      - mean
      - standard_deviation
      - confidence_interval_lower
      - confidence_interval_upper
      - n_samples
      - display_order
      - panel
    reject_unrecognized_columns: true

  dataset_inventory:
    allowed_columns:
      - dataset
      - content_category
      - access_category
      - file_count
      - sample_count
      - atlas
      - matrix_type
      - release_policy_decision
    reject_unrecognized_columns: true

  data_dictionary:
    allowed_columns:
      - field
      - description
      - data_type
      - units
      - nullable
      - content_category
      - access_category
    reject_unrecognized_columns: true

  provenance:
    allowed_columns:
      - relative_path
      - sha256
      - source_category
      - content_category
      - repository_commit
      - config_fingerprint
      - software_version
      - transformation
    reject_unrecognized_columns: true

arrays:
  public_connectome_npz:
    allowed_keys:
      - connectomes
    forbidden_keys:
      - participant_ids
      - subject_ids
      - scan_ids
      - session_ids
      - visit_ids
      - image_ids
      - source_paths
      - original_filenames
    connectomes:
      ndim: 3
      shape: "n_samples,n_regions,n_regions"
      dtype:
        - float32
        - float64
      finite: true
      symmetric: true
      square: true
      positive_definite: true
    allow_pickle: false
    allow_object_dtype: false

datasets:
  adni:
    public_metadata_columns: []
    exact_split_columns: []
  adnidod:
    public_metadata_columns: []
    exact_split_columns: []
  oasis3:
    public_metadata_columns: []
    exact_split_columns: []
  abide:
    public_metadata_columns:
      - sample_uid
    exact_split_columns: []
    status: permission_confirmed_artifact_binding_required
  cobre:
    public_metadata_columns:
      - sample_uid
    exact_split_columns: []
    status: permission_confirmed_artifact_binding_required
  camcan:
    public_metadata_columns:
      - sample_uid
      - age
      - sex
    exact_split_columns: []
    status: permission_confirmed_artifact_binding_required
  1000brains:
    public_metadata_columns: []
    exact_split_columns: []
    status: manual_required

approval_rule:
  adding_a_column_or_array_key_requires:
    - documented_redistribution_permission
    - privacy_review
    - deliberate_dataset_specific_allowlist_edit
    - complete_manual_approval_record
  deidentification_alone_is_not_permission: true
